<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daybook</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0d1226;--sf:#161d3a;--ink:#e8ecfa;--mu:#8e98c0;--ln:#262f57;--br:#8aa0ff;--bi:#0d1226;--so:#222b55;--wn:#ff7a70;--gd:#ffc933}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.55 Manrope,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
button,input,select,textarea{font:inherit}
.pt{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:10px 4px 14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;font-weight:800;margin:0 0 10px}
.hero{background:linear-gradient(150deg,#243b9c,#5a2fb8);color:#fff;border-radius:26px;padding:16px 16px 20px;margin-bottom:12px}
.dn{display:flex;align-items:center;justify-content:space-between}
.dt{text-align:center;line-height:1.25}.dt b{display:block;font-size:22px;font-weight:800}.dt span{font-size:13px;opacity:.8}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:24px;cursor:pointer}
.ib:disabled{opacity:.3;cursor:default}
.ring{width:170px;display:block;margin:6px auto 0}
.rt{fill:none;stroke:rgba(255,255,255,.22);stroke-width:12}
.rf{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .4s}.rf.full{stroke:var(--gd)}
.rn{fill:#fff;font-size:30px;font-weight:800}.rs{fill:#fff;opacity:.8;font-size:11px}

.h:first-of-type{border-top:0}
.chk{width:40px;height:40px;border-radius:14px;border:2px solid var(--c);background:transparent;color:#fff;font-size:20px;flex:none;cursor:pointer;display:grid;place-items:center}
.chk.on{background:var(--c)}
.n{flex:1}.fl{font-size:14px;color:var(--mu)}
.btn{background:var(--br);color:var(--bi);border:0;border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer}

.row{display:flex;gap:8px;align-items:center;justify-content:space-between}

.sum{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.in{color:var(--br)}.out{color:var(--wn)}
.cb{display:flex;justify-content:space-between;margin-top:8px}
.bar{height:8px;background:var(--so);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%}
.entry{border-top:1px solid var(--ln);padding:10px 0}.entry:first-of-type{border-top:0}
.entry p{margin:2px 0 0;white-space:pre-wrap}
.d,.cap,.saved{color:var(--mu);font-size:13px}.saved{min-height:20px;margin-top:4px}
.del{background:none;border:0;color:var(--wn);font-weight:700;cursor:pointer;padding:6px}
.lnk{background:none;border:0;color:var(--br);font-weight:700;cursor:pointer;padding:6px}
.empty{color:var(--mu);text-align:center;padding:14px 0}
svg{display:block}.ct{fill:var(--mu);font-size:10px}.cf{fill:var(--br)}.ce{fill:var(--wn)}.cl{stroke:var(--ln);stroke-width:1}.cp{fill:none;stroke:var(--br);stroke-width:2}.cd{fill:var(--br)}

nav button.on{background:var(--so);color:var(--br)}
.chip{display:inline-flex;align-items:center;background:var(--so);border-radius:20px;padding:0 4px 0 12px;margin:4px 6px 4px 0;font-size:14px}
.st{display:flex;align-items:center;gap:6px}.st button{width:32px;height:32px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}.st b{font-size:14px;min-width:42px;text-align:center}
.rp{display:flex;gap:8px;align-items:center;margin:2px 0 10px;color:var(--mu)}.rp input{width:20px;height:20px}
#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock[hidden]{display:none}
.lk{width:100%;max-width:320px;text-align:center}
.lk h2{font-size:22px;font-weight:800;margin:0 0 14px}
.pd{display:flex;gap:14px;justify-content:center;margin-bottom:8px}.pd i{width:16px;height:16px;border-radius:50%;border:2px solid var(--br)}.pd i.f{background:var(--br)}
.pm{min-height:24px;color:var(--wn);font-size:14px;margin-bottom:6px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp button{height:62px;border-radius:18px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:24px;font-weight:700;cursor:pointer}
.kp button.x{background:none;border:0;font-size:15px;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#toast.show{opacity:1}
</style>
</head>

 K('Backup','<div class="row" style="justify-content:flex-start"><button class="btn" data-a="share">Share backup</button><button class="btn ghost" data-a="exp">Copy backup</button><button class="btn ghost" data-a="imp">Restore</button></div><textarea id="bk" style="min-height:70px;margin-top:8px" placeholder="Paste a backup here to restore"></textarea><div class="cap">'+(S.lastBk?'Last backup: '+fmt(iso(new Date(S.lastBk)))+'. ':'No backup yet. ')+'Clearing browser data erases everything, so back up weekly. Share backup can send it to Notes, WhatsApp or email.</div>')}

var TITLES={habits:"Habits",money:"Money",report:"Insights",journal:"Journal"};
function render(){
 $("v").innerHTML=(TITLES[tab]?'<h1 class="pt">'+TITLES[tab]+'</h1>':'')+({today:today,habits:habits,money:money,report:report,journal:journal})[tab]();
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.v===tab)})}

/* PIN lock */
function hp(p){var e=new TextEncoder().encode("wz:"+p);return window.crypto&&crypto.subtle?crypto.subtle.digest("SHA-256",e).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}):Promise.resolve(btoa("wz:"+p))}
function drawLock(){var L=$("lock");L.hidden=false;
 $("lt").textContent=lm==="u"?"Enter your PIN":lm==="n"?"Choose a 4-digit PIN":"Confirm your PIN";
 $("pd").innerHTML=[0,1,2,3].map(function(i){return '<i class="'+(i<buf.length?'f':'')+'"></i>'}).join("");
 $("pm").textContent=msg;
 var k='';[1,2,3,4,5,6,7,8,9].forEach(function(n){k+='<button data-a="k" data-v="'+n+'">'+n+'</button>'});
 k+=(lm==="u"?'<span></span>':'<button class="x" data-a="kc">Cancel</button>')+'<button data-a="k" data-v="0">0</button><button class="x" data-a="k" data-v="b" aria-label="Delete">⌫</button>';
 $("kp").innerHTML=k;
 $("lx").innerHTML=lm==="u"?'<button class="lnk" data-a="forgot" style="margin-top:16px">Forgot PIN?</button>':''}
function showLock(m){lm=m;buf="";tmp="";msg="";drawLock()}
function key(v){if(v==="b")buf=buf.slice(0,-1);else if(buf.length<4)buf+=v;drawLock();if(buf.length===4)setTimeout(chk,120)}
function chk(){
 if(lm==="u"){hp(buf).then(function(h){if(h===PINH){$("lock").hidden=true;msg="";render()}else{msg="Wrong PIN. Try again.";buf="";drawLock()}})}
 else if(lm==="n"){tmp=buf;buf="";lm="c";msg="";drawLock()}
 else if(buf===tmp){hp(buf).then(function(h){PINH=h;try{localStorage.setItem(PK,h)}catch(e){}$("lock").hidden=true;render();toast("PIN saved")})}
 else{buf="";tmp="";lm="n";msg="PINs didn’t match. Start again.";drawLock()}}

/* events */
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,v=b.dataset.v,x,i;
 if(a==="tab"||a==="go"){tab=v;render();window.scrollTo(0,0)}
 else if(a==="d"){var nd=addDays(D,+v);if(nd<=T){D=nd;render()}}
 else if(a==="tg"){var hh=HB(v);if(hh&&hh.q){var qq=S.qty[D]||(S.qty[D]={});qq[v]=done(v,D)?0:hh.q;save();render();return}var l=S.log[D]||[];i=l.indexOf(v);if(i>-1)l.splice(i,1);else l.push(v);S.log[D]=l;save();render()}
 else if(a==="mood"){var n=S.notes[D]||{text:"",mood:""};n.mood=n.mood===v?"":v;S.notes[D]=n;save();render()}
 else if(a==="hm"){hmo=shiftM(hmo,+v);render()}
 else if(a==="hadd"){var nm=$("nh").value.trim();if(!nm)return;S.habits.push({id:"h"+Date.now(),name:nm,cat:$("hc").value,m:hmo,q:parseFloat($("hq").value)||0,u:$("hu").value.trim()});save();render()}
 else if(a==="hcopy"){var pm=shiftM(hmo,-1),k=0;hm(pm).forEach(function(y){if(!hm(hmo).some(function(z){return z.name===y.name&&z.cat===y.cat}))S.habits.push({id:"h"+Date.now()+(k++),name:y.name,cat:y.cat,m:hmo,q:y.q,u:y.u,t:y.t})});save();render();toast(k?k+" habits copied":"Nothing new to copy")}
 else if(a==="hdel"){if(confirm("Delete this habit?")){S.habits=S.habits.filter(function(y){return y.id!==v});save();render()}}
 else if(a==="hren"){x=S.habits.filter(function(y){return y.id===v})[0];var nn=x&&prompt("Rename habit",x.name);if(nn&&nn.trim()){x.name=nn.trim();save();render()}}
 else if(a==="qm"||a==="qp"){var h2=HB(v);if(h2){var q2=S.qty[D]||(S.qty[D]={}),st=stp(h2.q);q2[v]=Math.max(0,(q2[v]||0)+(a==="qp"?st:-st));save();render()}}
 else if(a==="htg"){var h3=HB(v),dm=dayCount(hmo),ng=h3&&parseInt(prompt("Goal: how many days this month? (1 to "+dm+")",h3.t||dm),10);if(ng>0){h3.t=Math.min(ng,dm);save();render()}}
 else if(a==="rdel"){if(confirm("Stop this monthly repeat? Past entries stay.")){S.rec=S.rec.filter(function(y){return y.id!==v});save();render()}}
 else if(a==="gadd"){var gn=$("gn").value.trim(),gt=parseFloat($("gt").value);if(!gn||!(gt>0))return;S.goals.push({id:"g"+Date.now(),name:gn,target:gt,saved:0});save();render()}
 else if(a==="gdep"){var g=S.goals.filter(function(y){return y.id===v})[0],ga=g&&parseFloat(prompt("Amount to add to “"+g.name+"” (use a minus to take out)","0"));if(g&&ga){g.saved=Math.max(0,g.saved+ga);save();render()}}
 else if(a==="gdel"){if(confirm("Delete this goal?")){S.goals=S.goals.filter(function(y){return y.id!==v});save();render()}}
 else if(a==="dadd"){var dw=$("dw").value.trim(),da=parseFloat($("da").value);if(!dw||!(da>0))return;S.debts.push({id:"d"+Date.now(),who:dw,amt:da,paid:0,dir:$("dd").value,date:T});save();render()}
 else if(a==="dpay"){var db=S.debts.filter(function(y){return y.id===v})[0],dp=db&&parseFloat(prompt("Payment amount for "+db.who,String(db.amt-db.paid)));if(db&&dp>0){db.paid=Math.min(db.amt,db.paid+dp);save();render()}}
 else if(a==="ddel"){if(confirm("Delete this debt?")){S.debts=S.debts.filter(function(y){return y.id!==v});save();render()}}
 else if(a==="yr"){yr+=+v;render()}
 else if(a==="driveconnect"){driveConnect()}
 else if(a==="drivesync"){driveSync(true)}
 else if(a==="drivedisconnect"){driveToken=null;driveStatus("Disconnected. Data remains on this device and in any existing Drive backup.");toast("Google Drive disconnected")}
 else if(a==="share"){S.lastBk=Date.now();save();var js=JSON.stringify(S);if(navigator.share){navigator.share({title:"Daybook backup",text:js}).then(function(){toast("Backup shared")}).catch(function(){})}else{var tb=$("bk");tb.value=js;tb.select();try{document.execCommand("copy")}catch(e){}toast("Backup copied")}}
 else if(a==="hcadd"){var cn=$("hcn").value.trim();if(!cn)return;if(CATS.some(function(z){return z.toLowerCase()===cn.toLowerCase()})){toast("That category already exists");return}S.hcats.push(cn);rc();save();render();toast("Category added")}
 else if(a==="hcdel"){var cd=S.hcats[+v];if(cd&&confirm("Delete “"+cd+"”? Its habits move to Other.")){S.habits.forEach(function(y){if(y.cat===cd)y.cat="Other"});S.hcats.splice(+v,1);rc();save();render()}}
 else if(a==="mcdel"){var mtp=v[0],mi=+v.slice(1),mn2=S.cats[mtp][mi];if(mn2&&confirm("Delete “"+mn2+"”? Old entries keep their label.")){S.cats[mtp].splice(mi,1);save();render()}}
 else if(a==="mt"){mt=v;render()}
 else if(a==="mo"){mo=shiftM(mo,+v);render()}
 else if(a==="madd"){var am=parseFloat($("am").value);if(!(am>0)){$("am").focus();return}var dv=$("md").value||T;S.money.push({id:"m"+Date.now(),date:dv,type:mt,amt:am,cat:$("mc").value,note:$("mn").value.trim()});if($("mr").checked)S.rec.push({id:"r"+Date.now(),type:mt,amt:am,cat:$("mc").value,note:$("mn").value.trim(),day:+dv.slice(8),start:shiftM(dv.slice(0,7),1),g:{}});mo=dv.slice(0,7);save();render();toast("Entry saved")}
 else if(a==="mdel"){if(confirm("Delete this entry?")){S.money=S.money.filter(function(y){return y.id!==v});save();render()}}
 else if(a==="ncat"){var c=$("nc").value.trim();if(!c)return;S.cats[mt].push(c);save();render()}
 else if(a==="bset"){var bv=parseFloat($("bv").value),bk=$("bcat").value;if(bv>0)S.bud[bk]=bv;else delete S.bud[bk];save();render();toast("Limit updated")}
 else if(a==="lock"){showLock("u")}
 else if(a==="pin"){showLock("n")}
 else if(a==="pinrm"){if(confirm("Remove the PIN lock?")){PINH=null;try{localStorage.removeItem(PK)}catch(e){}render();toast("PIN removed")}}
 else if(a==="exp"){S.lastBk=Date.now();save();var t=$("bk");t.value=JSON.stringify(S);t.select();try{document.execCommand("copy");toast("Backup copied")}catch(e){toast("Select the text and copy it")}}
 else if(a==="imp"){try{var d=JSON.parse($("bk").value);if(!d.habits||!d.log||!d.notes)throw 0;S=d;save();window.location.reload()}catch(e){toast("That backup isn’t valid")}}
 else if(a==="k"){key(v)}
 else if(a==="kc"){$("lock").hidden=true}
 else if(a==="forgot"){if(confirm("Forgot your PIN? The only way in is to erase ALL data on this device. Erase everything?")){try{localStorage.removeItem(KEY);localStorage.removeItem(PK)}catch(e){}window.location.reload()}}
});
var tm;
document.addEventListener("input",function(e){var t=e.target;
 if(t.id==="note"){var n=S.notes[D]||{text:"",mood:""};n.text=t.value;S.notes[D]=n;clearTimeout(tm);tm=setTimeout(function(){save();var s=$("saved");if(s)s.textContent="Saved ✓"},400)}
 else if(t.id==="cur"){S.cur=t.value||"AFN";save()}
 else if(t.id==="q"){$("jl").innerHTML=jl(t.value.trim().toLowerCase())}});
document.addEventListener("visibilitychange",function(){if(document.hidden)hid=Date.now();else if(PINH&&hid&&Date.now()-hid>60000)showLock("u")});
applyRec();render();
if(PINH)showLock("u");
})();
</script>
</body>
